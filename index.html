<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>성토마스 병원</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="성토마스병원">
<link rel="manifest" href="manifest.json">
<style>
:root{--p:#0f4c81;--s:#1e6fb8;--bg:#f4f7fa;--t:#1f2937}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}
body{background:var(--bg);color:var(--t);max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,var(--p),var(--s));color:#fff;padding:22px 20px;border-radius:0 0 24px 24px}
.top{display:flex;justify-content:space-between;margin-bottom:10px}
.badge{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:12px;font-size:12px}
.lbtn{background:#fff;color:var(--p);border:none;padding:5px 12px;border-radius:15px;font-size:12px;font-weight:700;cursor:pointer}
h1{font-size:23px;font-weight:800;margin-bottom:4px}
.doc{background:rgba(255,255,255,.15);padding:10px 14px;border-radius:12px;font-size:13px;margin-top:10px;line-height:1.5}
.iban{background:#e0f2fe;border:1px solid #bae6fd;margin:14px 16px 0;padding:12px 16px;border-radius:14px;display:flex;justify-content:space-between;align-items:center}
.ibtn{background:#0284c7;color:#fff;border:none;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}
.qact{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}
.acard{background:#fff;padding:13px;border-radius:16px;text-decoration:none;color:var(--t);display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.cbox{flex:1;background:#fff;margin:0 16px 16px;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #e5e7eb}
.chead{background:#f8fafc;padding:13px 16px;border-bottom:1px solid #e5e7eb;font-weight:700;font-size:14px}
.cmsg{flex:1;padding:14px;overflow-y:auto;max-height:300px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.45}
.mai{background:#f1f5f9;align-self:flex-start}
.musr{background:var(--p);color:#fff;align-self:flex-end}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 14px 12px}
.chip{background:#eff6ff;color:var(--p);border:1.5px solid #93c5fd;padding:12px 8px;border-radius:14px;font-size:14px;font-weight:800;text-align:center;cursor:pointer}
.ibox{display:flex;padding:10px;border-top:1px solid #e5e7eb;gap:6px;align-items:center}
.cambtn{background:#e0f2fe;color:#0369a1;border:none;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;flex-shrink:0}
.cin{flex:1;border:1px solid #d1d5db;border-radius:20px;padding:10px 14px;font-size:14px;min-width:0}
.sbtn{background:var(--p);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-weight:700;cursor:pointer;flex-shrink:0}
.mod{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:20px}
.mc{background:#fff;padding:24px;border-radius:20px;max-width:340px;text-align:center}
</style>
</head>
<body>
<header>
<div class="top"><span class="badge">Santa Clara, CA</span><button class="lbtn" onclick="tl()" id="lb">English</button></div>
<h1 id="cn">성토마스 병원</h1>
<div style="font-size:14px;opacity:.9" id="cs">St. Thomas Medical Clinic • 가정의학·노인의학</div>
<div class="doc">👨‍⚕️ <strong>Dr. Peter K. Chung, DO</strong><br>🕒 월-금 9:00 AM - 4:00 PM (사전 예약제)</div>
</header>
<div class="iban">
<div style="font-size:13px;color:#0369a1;font-weight:600" id="it">📲 스마트폰 바탕화면에<br>성토마스 병원 앱 설치하기</div>
<button class="ibtn" onclick="document.getElementById('im').style.display='flex'" id="ib">1초 앱 설치</button>
</div>
<div class="qact">
<a href="tel:6508308223" class="acard">📞 <span id="ct">전화 연결</span></a>
<a href="https://google.com" target="_blank" class="acard">📍 <span id="mt">오시는 길</span></a>
</div>
